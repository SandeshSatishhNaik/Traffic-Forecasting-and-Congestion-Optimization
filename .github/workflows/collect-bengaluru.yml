name: Collect Bengaluru traffic

# Collects TomTom speeds for 10 Bengaluru roads around the clock and commits the
# rows to the `bengaluru-data` branch (see collector/README.md). Every 15 min in
# the rush hours (07:07-11:07 and 16:07-21:07 IST), every 30 min at midday,
# hourly at night: 56 readings a day, inside TomTom's free tier.
#
# GitHub's cron scheduler does not reliably start scheduled runs on new
# repositories, so each run keeps its own timer for about 5.5 hours
# (collector/loop.sh) and then starts the next run itself. The schedule below
# is only a backup that restarts the chain if it ever stops. While the chain is
# running, a scheduled run waits in the queue and is cancelled when the next
# chained run starts; those cancelled runs are expected.
#
# To stop collecting: Settings > Secrets and variables > Actions > Variables,
# set COLLECT_ENABLED to false. The chain ends when the current run finishes
# (cancel it on the Actions tab to stop immediately).
#
# Runs are free on public repositories. On a private repository this chain
# would use far more than the free 2,000 Actions minutes a month.

on:
  schedule:
    - cron: "7 */3 * * *"  # backup only, every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      chained:
        description: "Started by the previous run (skip the immediate collection)"
        type: boolean
        default: false

permissions:
  contents: write  # push data to the bengaluru-data branch
  actions: write   # start the next run of this workflow

concurrency:
  group: collect-bengaluru
  cancel-in-progress: false

jobs:
  collect:
    if: vars.COLLECT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Collect on schedule, then start the next run
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOOP_MINUTES: "330"
          COLLECT_NOW: ${{ github.event_name == 'workflow_dispatch' && !inputs.chained }}
        run: bash collector/loop.sh
